<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Pedidos | PDV Espetinho</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/monitor.css') }}">
    <script defer src="{{ url_for('static', filename='js/libs/socket.io.min.js') }}"></script>
    <script defer src="{{ url_for('static', filename='js/monitor.js') }}"></script>
</head>
<body>
    <main class="monitor-board">
        <section class="monitor-column ready-column" aria-labelledby="titulo-prontos">
            <header class="column-header ready-header">
                <span class="header-icon" aria-hidden="true">
                    <span class="ember-dot"></span>
                </span>
                <span>
                    <small>Seu pedido saiu da brasa</small>
                    <strong id="titulo-prontos">Pronto para retirada</strong>
                </span>
            </header>
            <div id="lista-pronto" class="order-list" aria-live="polite"></div>
        </section>

        <section class="monitor-column preparing-column" aria-labelledby="titulo-preparando">
            <header class="column-header preparing-header">
                <span class="header-icon grill-icon" aria-hidden="true">
                    <span></span><span></span><span></span>
                </span>
                <span>
                    <small>Preparando com cuidado</small>
                    <strong id="titulo-preparando">Na brasa</strong>
                </span>
            </header>
            <div id="lista-preparando" class="order-list" aria-live="polite"></div>
        </section>
    </main>

    <div id="status-conexao" class="connection-status" data-state="online" role="status">
        Reconectando ao servidor…
    </div>

    <section
        id="animacao-fogo-overlay"
        class="ready-overlay"
        role="status"
        aria-live="assertive"
        aria-hidden="true"
        hidden
    >
        <div class="heat-haze" aria-hidden="true"></div>
        <div class="ember-surge" aria-hidden="true"></div>
        <div id="container-faiscas" class="spark-layer" aria-hidden="true"></div>

        <div class="announcement">
            <div id="texto-pedido-pronto" class="ready-title">
                <span class="ready-title-kicker">Direto da brasa</span>
                <strong>Pedido pronto</strong>
            </div>

            <div id="chamada-cliente" class="customer-call">
                <span class="customer-call-label">Pode retirar,</span>
                <strong id="texto-nome-cliente"></strong>
                <span id="texto-numero-pedido" class="customer-order-number"></span>
            </div>
        </div>
    </section>
</body>
</html>
